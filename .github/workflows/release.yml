name: Build Debian packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build amd64 package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            gettext \
            libcairo2-dev \
            libgtk-4-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build package
        env:
          DEB_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${DEB_VERSION#v}"
          cargo build --release --locked
          bash packaging/build-deb.sh amd64 "$VERSION" dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/*.deb

  build-arm:
    name: Build ${{ matrix.deb_arch }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            deb_arch: armhf
          - arch: aarch64
            deb_arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package in ${{ matrix.arch }} container
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/dist"
          dockerRunArgs: |
            --volume "${PWD}/dist:/artifacts"
          env: |
            RELEASE_TAG: ${{ github.ref_name }}
          install: |
            apt-get update -q -y
            apt-get install -q -y \
              build-essential \
              ca-certificates \
              curl \
              dpkg-dev \
              gettext \
              libcairo2-dev \
              libgtk-4-dev
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            VERSION="${RELEASE_TAG#v}"
            cargo build --release --locked
            bash packaging/build-deb.sh "${{ matrix.deb_arch }}" "$VERSION" /artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: dist/*.deb

  release:
    name: Publish GitHub release
    needs:
      - build-amd64
      - build-arm
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.deb
